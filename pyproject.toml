[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "netcraze-mcp"
version = "0.7.0"
description = "MCP server for NetCraze routers — manage interfaces, clients, routes and system via Cursor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0,<2.0.0",
    "httpx>=0.27.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
netcraze-mcp = "netcraze_mcp.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
